name: Pinot LinkedIn Publication Pipeline

on:
  workflow_dispatch: {}
  schedule:
    # Runs every day at 09:00 UTC (1 AM PST)
    - cron: "0 9 * * *"

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MVN_JFROG_USER: ${{ secrets.MVN_JFROG_USER }}
      MVN_JFROG_KEY:  ${{ secrets.MVN_JFROG_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # Compute a unique release version: <base>-li-<run>
      - name: Compute & set version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # 1) Base version from POM (strip -SNAPSHOT if present)
          BASE=$(mvn -q --non-recursive -Pli-publish exec:exec -Dexec.executable=echo -Dexec.args='${project.version}')
          BASE=${BASE%-SNAPSHOT}

          # 2) Figure out branch name
          BRANCH="${GITHUB_REF_NAME:-$(basename "${GITHUB_REF}")}"

          # 3) Decide version suffix:
          #    - master: keep existing pattern -> li-<run>
          #    - others: add sanitized branch name -> li-<run>-<branch>
          if [[ "${BRANCH}" == "master" ]]; then
            SUFFIX="li-${GITHUB_RUN_NUMBER}"
          else
            # Sanitize branch for Maven version compatibility:
            # - lowercase
            # - replace anything not [a-z0-9._-] with '-'
            # - collapse multiple '-' and trim leading/trailing '-'
            SAFE_BRANCH=$(echo "${BRANCH}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g; s/-{2,}/-/g')
            # (Optional) keep it reasonably short
            SAFE_BRANCH="${SAFE_BRANCH:0:40}"
            SUFFIX="li-${GITHUB_RUN_NUMBER}-${SAFE_BRANCH}"
          fi

          NEW_VERSION="${BASE}-${SUFFIX}"
          echo "Setting project version to: ${NEW_VERSION}"
          echo "release_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          mvn -B -q -Pli-publish versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false
          mvn -B -q -Pli-publish versions:commit

      - name: Build the repo
        run: |
          mvn -B -T1C clean install \
            -DskipTests \
            -pl '!pinot-distribution,
                 !pinot-plugins/pinot-file-system/pinot-gcs,
                 !pinot-plugins/pinot-environment/pinot-azure,
                 !pinot-plugins/pinot-input-format/pinot-confluent-protobuf' \
            -Pbin-dist -Pbuild-shaded-jar -Pli-publish \
            --no-transfer-progress \
            -Djdk.version=11

      - name: Deploy to Artifactory
        run: |
          mvn -B deploy \
            -DskipTests \
            -P build-shaded-jar,li-publish \
            -pl '!pinot-distribution,
                 !pinot-plugins/pinot-file-system/pinot-gcs,
                 !pinot-plugins/pinot-environment/pinot-azure,
                 !pinot-plugins/pinot-input-format/pinot-confluent-protobuf' \
            --no-transfer-progress \
            -Djdk.version=11 \
            -s ci.settings.xml \
            -DretryFailedDeploymentCount=5 \
            -DaltDeploymentRepository=central::default::https://linkedin.jfrog.io/artifactory/pinot

      - name: Create git tag for release
        if: success()
        run: |
          TAG="release/${{ steps.version.outputs.release_version }}"
          echo "Creating tag: ${TAG}"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Print pinot-lnkd-deps tree
        if: success()
        run: |
          echo "Dependency tree for pinot-lnkd-deps:"
          mvn -B dependency:tree -pl pinot-lnkd-deps -Pli-publish -s ci.settings.xml || true